services:
  model-engine:
    build: .
    ports:
      # host loopback only, so other computers on the network cannot reach it
      - "127.0.0.1:${MODEL_ENGINE_PORT:-4777}:${MODEL_ENGINE_PORT:-4777}"
    environment:
      # the server and the healthcheck read the port from here
      - MODEL_ENGINE_PORT=${MODEL_ENGINE_PORT:-4777}
      # passed through from your shell or .env; no default, never written here
      # Claude subscription token (from `claude setup-token`) or an API key; the agents in /workspace can read it
      - CLAUDE_CODE_OAUTH_TOKEN
      - ANTHROPIC_API_KEY
      # synced from the PC by scripts/sync-claude-token.js; read on every chat start, preferred over CLAUDE_CODE_OAUTH_TOKEN
      - CLAUDE_CODE_OAUTH_TOKEN_FILE=/run/host-secrets/claude-oauth-token
    volumes:
      # project list survives rebuilds
      - engine-data:/data
      # the only host folder the agents can touch
      - ${WORKSPACE:-./workspace}:/workspace
      # a directory, not a single file: file mounts break when the file is replaced. Create it first (the sync script does).
      - ./secrets:/run/host-secrets:ro
    restart: unless-stopped

volumes:
  engine-data:
